# /etc/nginx/conf.d/xiaoshitanji.papaclaoud.top.conf
# HTTP：只保留 ACME 验证，其余跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name xiaoshitanji.papaclaoud.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xiaoshitanji.papaclaoud.top;

    ssl_certificate /etc/letsencrypt/live/xiaoshitanji.papaclaoud.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoshitanji.papaclaoud.top/privkey.pem;

    # 与 App 端 8 MB 快照上限对齐，留一点 JSON 包装余量
    client_max_body_size 10m;

    location = /privacy {
        root /var/www/xiaoshitanji;
        try_files /privacy.html =404;
    }
    location = /support {
        root /var/www/xiaoshitanji;
        try_files /support.html =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
