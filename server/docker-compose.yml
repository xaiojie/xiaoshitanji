name: diary-sync

services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://diary:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/diary
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
      MAX_USERS: ${MAX_USERS:-50}
      VERSIONS_KEPT: ${VERSIONS_KEPT:-20}
      AUTH_ATTEMPTS_PER_MINUTE: ${AUTH_ATTEMPTS_PER_MINUTE:-10}
      TRUST_PROXY_HEADERS: "1"
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: diary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
